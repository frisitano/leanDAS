[workspace]
members = [
    "crates/das-core",
    "crates/das-prover",
    "crates/das-verifier",
    "crates/das-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Local crates
das-core = { path = "crates/das-core" }
das-prover = { path = "crates/das-prover" }
das-verifier = { path = "crates/das-verifier" }
das-cli = { path = "crates/das-cli" }

# leanVM dependencies
lean_vm = { git = "https://github.com/leanEthereum/leanMultisig", rev = "df0807f7b1d670f9fca44fc0a7431cb5dfe9c8b7" }
lean_prover = { git = "https://github.com/leanEthereum/leanMultisig", rev = "df0807f7b1d670f9fca44fc0a7431cb5dfe9c8b7" }
lean_compiler = { git = "https://github.com/leanEthereum/leanMultisig", rev = "df0807f7b1d670f9fca44fc0a7431cb5dfe9c8b7" }
rec_aggregation = { git = "https://github.com/leanEthereum/leanMultisig", rev = "df0807f7b1d670f9fca44fc0a7431cb5dfe9c8b7" }
sub_protocols = { git = "https://github.com/leanEthereum/leanMultisig", rev = "df0807f7b1d670f9fca44fc0a7431cb5dfe9c8b7" }
air = { git = "https://github.com/leanEthereum/leanMultisig", rev = "df0807f7b1d670f9fca44fc0a7431cb5dfe9c8b7" }
backend = { git = "https://github.com/leanEthereum/leanMultisig", rev = "df0807f7b1d670f9fca44fc0a7431cb5dfe9c8b7" }
utils = { git = "https://github.com/leanEthereum/leanMultisig", rev = "df0807f7b1d670f9fca44fc0a7431cb5dfe9c8b7" }

# External
rayon = "1.10"
tracing = "0.1"
tracing-subscriber = "0.3"
